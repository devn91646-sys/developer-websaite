
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e0a00">
<title>MK Consulting — Legal Studio for Creatives</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Big+Shoulders+Display:wght@700;800;900&family=Permanent+Marker&family=Roboto+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --u: min(100vw / 1672, 100dvh / 941);
  --orange: #f97316;
  --burnt: #c2410c;
  --cream: #fff9f1;
  --wall: #1e0a00;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  background: var(--wall);
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  overflow: hidden;
  color: white;
  font-family: "Roboto Condensed", sans-serif;
  background: var(--wall);
}

button, a { -webkit-tap-highlight-color: transparent; }

a {
  color: inherit;
  text-decoration: none;
}

/* FULL-SCREEN WALL */

.scene {
  position: relative;
  isolation: isolate;
  width: 100%;
  height: 100vh;
  height: 100svh;
  min-height: 540px;
  overflow: hidden;
  background: var(--wall);
}

.wall {
  position: absolute;
  z-index: -3;
  inset: 0;
  background-image:
    linear-gradient(rgba(25, 7, 0, .16), rgba(25, 7, 0, .24)),
    url("https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/a9f1e939-234a-4481-9706-3b0675e7aed2.webp");
  background-size: cover;
  background-position: center;
}

.wall::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(24, 7, 0, .12), transparent 40%),
    linear-gradient(0deg, rgba(24, 7, 0, .48), transparent 36%);
}

/* TOP NAVIGATION */

.topbar {
  position: absolute;
  z-index: 10;
  top: 0;
  left: 0;
  width: 100%;
  padding: clamp(15px, 2.1vw, 34px) 2.3vw 0;
  display: flex;
  align-items: center;
  gap: 12px;
  animation: navIn .8s .15s both;
}

.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: clamp(8px, 1.25vw, 22px);
  width: 100%;
}

.nav a {
  white-space: nowrap;
  text-transform: uppercase;
  font-size: clamp(10px, .93vw, 15px);
  font-weight: 600;
  letter-spacing: .055em;
  transition: opacity .25s, color .25s;
}

.nav a:hover {
  opacity: .7;
  color: #ffd4bd;
}

.nav-rule {
  height: 1px;
  min-width: 10px;
  flex: 1;
  background: rgba(255, 255, 255, .63);
  transform-origin: left;
}

/* GIANT TITLE */

.heading {
  position: absolute;
  z-index: 5;
  top: clamp(62px, 7.4vw, 124px);
  left: 1.6%;
  width: 96.8%;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: visible;
  white-space: nowrap;
  font-family: "Anton", Impact, sans-serif;
  font-size: clamp(72px, 17.25vw, 288.6px);
  font-weight: 400;
  line-height: .88;
  letter-spacing: -.025em;
  color: #fff;
  text-shadow: 0 3px 0 rgba(0,0,0,.12);
  pointer-events: none;
}

.heading span {
  display: inline-block;
  animation: letterUp .85s both;
  animation-delay: calc(.38s + var(--i) * .055s);
}

/* RING, CHAINS AND WORKERS */

.ring-area {
  position: absolute;
  z-index: 3;
  left: 50%;
  top: 19%;
  bottom: 7%;
  width: min(76vw, 890px);
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}

.ring-motion {
  position: relative;
  width: 100%;
  height: 100%;
  transform-origin: 50% 33%;
  will-change: transform;
  opacity: 0;
  animation: ringReveal 1.1s 1.05s ease forwards;
}

.ring-image {
  position: absolute;
  left: 50%;
  top: 0;
  height: 100%;
  width: 100%;
  object-fit: contain;
  object-position: center top;
  transform: translateX(-50%);
  filter: drop-shadow(0 12px 18px rgba(0,0,0,.27));
}

/* Curved spray-paint lettering */

.graffiti {
  position: absolute;
  left: 50%;
  top: 60%;
  width: 82%;
  height: 24%;
  overflow: visible;
  transform: translateX(-50%) rotate(-1deg);
  filter: url(#sprayGlow);
  pointer-events: none;
}

.graffiti text {
  font-family: "Permanent Marker", Impact, sans-serif;
  font-size: 31px;
  font-weight: 400;
  letter-spacing: 1px;
  fill: url(#orangeInk);
  stroke: rgba(255, 110, 27, .35);
  stroke-width: .6px;
  paint-order: stroke fill;
}

.graffiti path {
  fill: none;
  stroke: white;
  stroke-width: 1;
}

/* BOTTOM TAGLINE */

.tagline {
  position: absolute;
  z-index: 6;
  left: 50%;
  bottom: 2.7%;
  width: 100%;
  transform: translateX(-50%);
  text-align: center;
  font-family: "Big Shoulders Display", Impact, sans-serif;
  font-weight: 900;
  font-size: clamp(35px, 5.5vw, 82px);
  line-height: .79;
  letter-spacing: -.015em;
  text-transform: uppercase;
  text-shadow: 0 4px 18px rgba(0,0,0,.35);
  pointer-events: none;
}

.tagline span {
  display: block;
  overflow: hidden;
  padding: 3px 0;
}

.tagline b {
  display: inline-block;
  font-weight: 900;
  animation: taglineUp .85s 1.5s both;
}

.tagline span:nth-child(2) b {
  animation-delay: 1.68s;
}

.corner-label {
  position: absolute;
  z-index: 7;
  left: 2.4%;
  bottom: 3%;
  font-size: 10px;
  letter-spacing: .16em;
  line-height: 1.7;
  color: rgba(255,255,255,.78);
  text-transform: uppercase;
  animation: navIn 1s 1.4s both;
}

.corner-label strong {
  color: #fff;
  font-weight: 700;
}

.scroll-label {
  position: absolute;
  z-index: 7;
  right: 2.4%;
  bottom: 3.5%;
  font-size: 10px;
  letter-spacing: .17em;
  writing-mode: vertical-rl;
  color: rgba(255,255,255,.8);
  animation: navIn 1s 1.5s both;
}

/* ANIMATION SEQUENCE */

@keyframes navIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes letterUp {
  from {
    clip-path: inset(100% 0 0 0);
    transform: translateY(25%);
    opacity: .3;
  }
  to {
    clip-path: inset(0 0 0 0);
    transform: translateY(0);
    opacity: 1;
  }
}

@keyframes ringReveal {
  from {
    opacity: 0;
    transform: translateY(35px) scale(.96);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes taglineUp {
  from {
    transform: translateY(115%);
    opacity: .3;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

/* TABLETS */

@media (max-width: 900px) {
  .topbar {
    padding: 20px 2%;
  }

  .nav {
    flex-wrap: wrap;
    justify-content: center;
    column-gap: 12px;
    row-gap: 13px;
  }

  .nav-rule {
    flex: 0 1 24px;
  }

  .nav a {
    font-size: 12px;
  }

  .heading {
    top: 100px;
    font-size: clamp(68px, 16vw, 145px);
  }

  .ring-area {
    top: 24%;
    bottom: 12%;
    width: min(88vw, 720px);
  }

  .graffiti {
    top: 61%;
    width: 83%;
  }

  .graffiti text {
    font-size: 27px;
  }

  .tagline {
    bottom: 3%;
    font-size: clamp(38px, 7vw, 64px);
  }
}

/* PORTRAIT PHONES */

@media (max-width: 560px) {
  .scene {
    min-height: 620px;
  }

  .wall {
    background-position: 54% center;
  }

  .topbar {
    top: 12px;
    padding: 10px 16px;
  }

  .nav {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 11px 12px;
    justify-items: center;
  }

  .nav a {
    font-size: 11px;
    letter-spacing: .04em;
  }

  .nav-rule {
    display: none;
  }

  .nav a:nth-of-type(1) { grid-column: 1; grid-row: 1; }
  .nav a:nth-of-type(2) { grid-column: 2; grid-row: 1; }
  .nav a:nth-of-type(3) { grid-column: 3; grid-row: 1; }
  .nav a:nth-of-type(4) { grid-column: 1; grid-row: 2; }
  .nav a:nth-of-type(5) { grid-column: 2; grid-row: 2; }
  .nav a:nth-of-type(6) { grid-column: 3; grid-row: 2; }

  .heading {
    top: 103px;
    left: 0;
    width: 100%;
    flex-direction: column;
    gap: 0;
    font-size: clamp(69px, 18vw, 100px);
    line-height: .87;
    letter-spacing: -.025em;
  }

  .heading .space {
    display: none;
  }

  .ring-area {
    top: 23%;
    bottom: 13%;
    width: min(118vw, 550px);
  }

  .ring-image {
    object-position: center top;
  }

  .graffiti {
    top: 59%;
    width: 80%;
    height: 24%;
  }

  .graffiti text {
    font-size: 29px;
  }

  .tagline {
    bottom: 3.2%;
    font-size: clamp(40px, 11vw, 58px);
    line-height: .8;
  }

  .corner-label {
    left: 15px;
    bottom: 3%;
    font-size: 8px;
  }

  .scroll-label {
    right: 12px;
    bottom: 4%;
    font-size: 8px;
  }
}

/* SHORT LANDSCAPE SCREENS */

@media (max-height: 650px) and (min-width: 561px) {
  .heading {
    top: 74px;
    font-size: min(15vw, 180px);
  }

  .ring-area {
    top: 17%;
    bottom: 7%;
    width: min(62vw, 620px);
  }

  .tagline {
    font-size: clamp(30px, 4vw, 55px);
  }
}

/* ACCESSIBILITY */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }

  .ring-motion {
    opacity: 1;
  }
}
</style>
</head>

<body>
<main class="scene" id="scene">

  <div class="wall" aria-hidden="true"></div>

  <header class="topbar">
    <nav class="nav" aria-label="Main navigation">
      <a href="#about">About Us</a><span class="nav-rule"></span>
      <a href="#services">Services</a><span class="nav-rule"></span>
      <a href="#cases">Our Cases</a><span class="nav-rule"></span>
      <a href="#blog">Blog</a><span class="nav-rule"></span>
      <a href="mailto:hello@mkconsulting.example">Contacts</a><span class="nav-rule"></span>
      <a href="#vacancies">Vacancies</a>
    </nav>
  </header>

  <h1 class="heading" aria-label="MK Consulting">
    <span style="--i:0">M</span><span style="--i:1">K</span>
    <span class="space" style="--i:2">&nbsp;</span>
    <span style="--i:3">C</span><span style="--i:4">O</span>
    <span style="--i:5">N</span><span style="--i:6">S</span>
    <span style="--i:7">U</span><span style="--i:8">L</span>
    <span style="--i:9">T</span><span style="--i:10">I</span>
    <span style="--i:11">N</span><span style="--i:12">G</span>
  </h1>

  <section class="ring-area" id="ringArea" aria-label="The MK Consulting construction ring">
    <div class="ring-motion" id="ringMotion">
      <img
        class="ring-image"
        src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/f14add82-809a-41e1-a456-f47b8e57984b.webp"
        alt="Rusted industrial steel ring with chains and construction workers"
        fetchpriority="high"
      >

      <svg class="graffiti" viewBox="0 0 500 120" role="img" aria-label="We build your case">
        <defs>
          <linearGradient id="orangeInk" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#c2410c"/>
            <stop offset="48%" stop-color="#f97316"/>
            <stop offset="100%" stop-color="#fb923c"/>
          </linearGradient>

          <filter id="sprayGlow" x="-25%" y="-40%" width="150%" height="180%">
            <feTurbulence
              type="fractalNoise"
              baseFrequency=".7"
              numOctaves="2"
              seed="8"
              result="noise"
            />
            <feDisplacementMap in="SourceGraphic" in2="noise"
              scale="1.8" xChannelSelector="R" yChannelSelector="G"
              result="rough"/>
            <feGaussianBlur in="rough" stdDeviation=".35" result="soft"/>
            <feMerge>
              <feMergeNode in="soft"/>
              <feMergeNode in="rough"/>
            </feMerge>
          </filter>

          <clipPath id="paintClip">
            <rect id="paintRect" x="0" y="0" width="0" height="120"/>
          </clipPath>

          <path id="paintArc" d="M 18,28 Q 250,148 482,28"/>
        </defs>

        <g clip-path="url(#paintClip)" id="paintGroup">
          <text>
            <textPath href="#paintArc" startOffset="50%" text-anchor="middle">WE BUILD YOUR CASE</textPath>
          </text>
        </g>
      </svg>
    </div>
  </section>

  <div class="tagline">
    <span><b>Legal Studio For</b></span>
    <span><b>Creatives</b></span>
  </div>

  <div class="corner-label">
    <strong>MK / CONSULTING</strong><br>
    Independent legal studio
  </div>

  <div class="scroll-label">CREATIVITY NEEDS PROTECTION ↘</div>

  <!-- SVG filter definitions -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="unusedFilter"></filter>
    </defs>
  </svg>

</main>

<script>
(() => {
  const scene = document.getElementById("scene");
  const ring = document.getElementById("ringMotion");
  const ringArea = document.getElementById("ringArea");
  const paintRect = document.getElementById("paintRect");
  const motionPreference = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  );

  // Draw the graffiti from left to right.
  if (!motionPreference.matches) {
    const paintAnimation = paintRect.animate(
      [
        { width: "0px" },
        { width: "500px" }
      ],
      {
        duration: 1150,
        delay: 1350,
        easing: "cubic-bezier(.22,.75,.25,1)",
        fill: "forwards"
      }
    );
  } else {
    paintRect.setAttribute("width", "500");
  }

  // Magnet-like movement, only for fine mouse pointers.
  const finePointer = window.matchMedia(
    "(hover: hover) and (pointer: fine)"
  );

  if (!finePointer.matches || motionPreference.matches) return;

  let pointerX = -9999;
  let pointerY = -9999;
  let currentX = 0;
  let currentY = 0;
  let currentAngle = 0;
  let previousTime = 0;

  // Use a long-running Web Animation as the animation clock.
  const clock = scene.animate(
    [{ opacity: 1 }, { opacity: 1 }],
    { duration: 1000000000, iterations: Infinity }
  );
  clock.pause();

  scene.addEventListener("pointermove", event => {
    pointerX = event.clientX;
    pointerY = event.clientY;
  });

  scene.addEventListener("pointerleave", () => {
    pointerX = -9999;
    pointerY = -9999;
  });

  function animateRing(time) {
    const dt = previousTime ? Math.min(time - previousTime, 64) : 16;
    previousTime = time;

    const factor = 1 - Math.exp(-dt / 140);

    const area = ringArea.getBoundingClientRect();
    const centerX = area.left + area.width * .5;
    const centerY = area.top + area.height * .66;

    const dx = pointerX - centerX;
    const dy = pointerY - centerY;
    const distance = Math.hypot(dx, dy);
    const range = Math.max(area.width, 1);

    let targetX = 0;
    let targetY = 0;
    let targetAngle = 0;

    if (distance < range) {
      const strength = 1 - distance / range;

      targetX = Math.sign(dx) * Math.min(Math.abs(dx), 34) * strength;
      targetY = Math.sign(dy) * Math.min(Math.abs(dy), 34) * .45 * strength;
      targetAngle = Math.max(-3.5, Math.min(3.5, dx / range * 3.5))
                    * strength;
    }

    currentX += (targetX - currentX) * factor;
    currentY += (targetY - currentY) * factor;
    currentAngle += (targetAngle - currentAngle) * factor;

    ring.style.transform =
      `translate3d(${currentX}px, ${currentY}px, 0) rotate(${currentAngle}deg)`;

    requestAnimationFrame(animateRing);
  }

  requestAnimationFrame(animateRing);
})();
</script>
</body>
</html>
